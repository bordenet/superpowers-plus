name: Harsh Review

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff against main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shellcheck
        run: |
          if ! provision="$(python3 tools/validation-toolchain.py --provision-shellcheck "$RUNNER_TEMP/spp-shellcheck" 2>&1)"; then
            printf '%s\n' "$provision" >&2
            [[ "$provision" == *"HTTP Error 50"[234]* ]]
            bash .github/scripts/provision-shellcheck-fallback.sh "$RUNNER_TEMP/spp-shellcheck"
          fi
          echo "$RUNNER_TEMP/spp-shellcheck" >> "$GITHUB_PATH"

      # The shared strict lint + harsh body covers the former file-ending,
      # syntax, shebang, JSON and required-file checks, plus skill guards.
      - name: Registered static quality checks
        run: bash tools/test-all.sh --check harsh

      - name: Check version consistency
        run: bash tools/test-all.sh --check ci:quality-checks-check-version-consistency
      - name: Dangerous pattern scan
        run: bash tools/test-all.sh --check ci:quality-checks-dangerous-pattern-scan

      - name: Summary
        if: always()
        run: echo "HARSH REVIEW COMPLETE"
