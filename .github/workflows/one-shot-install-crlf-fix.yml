name: One-shot install.sh CRLF re-exec

on:
  push:
    branches: [cursor/windows-ci-crlf-fix-d3c7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/windows-ci-crlf-fix-d3c7
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch install.sh and remove this workflow
        env:
          EXPECTED: |
            # Match uninstall.sh: re-exec so the rest of this run uses the healed files.
            # A second pass finds no CR and continues into the real install.
            exec bash "$0" "$@"
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('install.sh')
          t = p.read_text(encoding='utf-8')
          old = (
              '    echo "[WARN] Fixed Windows line endings (CRLF \u2192 LF) in installer scripts."\n'
              '    echo "       Re-run: $0 $*"\n'
              '    echo ""\n'
              '    echo "       To prevent this, configure git:"\n'
              '    echo "         git config --global core.autocrlf input"\n'
              '    exit 0\n'
          )
          # File may use the unicode arrow or ASCII
          old_ascii = old.replace('\u2192', '\u2192')
          new = (
              '    echo "[WARN] Fixed Windows line endings (CRLF \u2192 LF) in installer scripts; continuing."\n'
              '    echo "       To prevent this, configure git:"\n'
              '    echo "         git config --global core.autocrlf input"\n'
              '    # Match uninstall.sh: re-exec so the rest of this run uses the healed files.\n'
              '    # A second pass finds no CR and continues into the real install.\n'
              '    exec bash "$0" "$@"\n'
          )
          if 'exec bash "$0" "$@"' in t.split('CRLF self-heal')[1].split('Source modules')[0]:
              print('already fixed')
          elif old not in t:
              # try with actual arrow character
              arrow = '\u2192'
              old2 = (
                  f'    echo "[WARN] Fixed Windows line endings (CRLF {arrow} LF) in installer scripts."\n'
                  '    echo "       Re-run: $0 $*"\n'
                  '    echo ""\n'
                  '    echo "       To prevent this, configure git:"\n'
                  '    echo "         git config --global core.autocrlf input"\n'
                  '    exit 0\n'
              )
              new2 = (
                  f'    echo "[WARN] Fixed Windows line endings (CRLF {arrow} LF) in installer scripts; continuing."\n'
                  '    echo "       To prevent this, configure git:"\n'
                  '    echo "         git config --global core.autocrlf input"\n'
                  '    # Match uninstall.sh: re-exec so the rest of this run uses the healed files.\n'
                  '    # A second pass finds no CR and continues into the real install.\n'
                  '    exec bash "$0" "$@"\n'
              )
              if old2 not in t:
                  raise SystemExit('CRLF heal block not found')
              p.write_text(t.replace(old2, new2, 1), encoding='utf-8')
              print('patched with arrow')
          else:
              p.write_text(t.replace(old, new, 1), encoding='utf-8')
              print('patched')
          PY
          rm -f .github/workflows/one-shot-install-crlf-fix.yml
          git config user.email "ci@superpowers-plus.test"
          git config user.name "superpowers-plus CI"
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "fix(install): re-exec after CRLF heal like uninstall.sh"
          git push origin HEAD:cursor/windows-ci-crlf-fix-d3c7
