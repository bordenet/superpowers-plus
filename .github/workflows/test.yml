name: Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  node-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Plans are published before dependency installation. The helper elects
      # the oldest equivalent run, waits for its verified result, and fails closed.
      - name: Describe validation inputs
        id: inputs
        run: node tools/ci-validation-reuse.js plan node

      - name: Publish validation plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.plan-name }}
          path: .ci-validation/node/plan.json
          retention-days: 90
          include-hidden-files: true
          overwrite: true

      - name: Reuse equivalent validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci-validation-reuse.js resolve node

      - name: Validation execution marker
        if: steps.reuse.outputs.skip != 'true'
        run: echo "Running fresh node validation"

      - name: Install MCP dependencies
        if: steps.reuse.outputs.skip != 'true'
        run: cd mcp && npm ci

      - name: Validation reuse regression tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-validation-reuse-regression-tests

      - name: Receipt producer regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-receipt-producer-regressions

      - name: Toolchain compatibility regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-toolchain-compatibility-regressions

      - name: Strategy boundary regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-strategy-boundary-regressions

      - name: Input closure regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-input-closure-regressions

      - name: Review dispatch regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-review-dispatch-regressions

      - name: Review hook installation regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-review-hook-install-regressions

      - name: Strategy policy regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-strategy-policy-regressions

      - name: CI boundary registry regressions
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-ci-boundary-registry-regressions

      - name: Frontmatter parser tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-frontmatter-parser-tests

      - name: Skill router tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-skill-router-tests

      - name: Skill discovery tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-skill-discovery-tests

      - name: Composition engine tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-composition-engine-tests

      - name: Workflow state tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-workflow-state-tests

      - name: Compression unit tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-compression-unit-tests

      - name: Compression safety gate
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-compression-safety-gate

      - name: EI-move detector
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-ei-move-detector
        env:
          # Waivers are declared in the PR body as: EI-WAIVER: <skill> -<pct>% — <reason>
          # On push events github.event.pull_request is null so EI_WAIVERS is
          # empty — waivers without a paired --update will fail post-merge push
          # CI. Always run --update when using a waiver before merging.
          EI_WAIVERS: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}

      - name: Operative-move detector
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-operative-move-detector
        env:
          # Waivers are declared in the PR body as: OP-WAIVER: <skill> <pattern> -<n> — <reason>
          OP_WAIVERS: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}

      - name: Hub-anchor validator
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-hub-anchor-validator

      - name: Skill-invocation smoke
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-skill-invocation-smoke

      - name: Visual companion keyed server
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-visual-companion-keyed-server

      - name: MCP smoke test
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-mcp-smoke-test
        env:
          PERSONAL_SKILLS_DIR: ${{ github.workspace }}/skills
          SUPERPOWERS_SKILLS_DIR: /dev/null

      - name: Language scanner tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-language-scanner-tests

      - name: use-skill CLI tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-use-skill-cli-tests

      - name: CR battery evidence verifier tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-cr-battery-evidence-verifier-tests

      - name: Lite manifest validation
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-lite-manifest-validation

      - name: Lite manifest regression tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-lite-manifest-regression-tests

      - name: Full oracle input parity
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-full-oracle-input-parity

      - name: Full installed output parity
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:node-tests-full-installed-output-parity

      - name: Record successful validation
        if: success() && steps.reuse.outputs.skip != 'true'
        run: node tools/ci-validation-reuse.js receipt node

      - name: Publish successful validation
        if: success() && steps.reuse.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.pass-name }}
          path: .ci-validation/node/receipt.json
          retention-days: 90
          include-hidden-files: true
          overwrite: true

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Plans are published before dependency installation. The helper elects
      # the oldest equivalent run, waits for its verified result, and fails closed.
      - name: Describe validation inputs
        id: inputs
        run: node tools/ci-validation-reuse.js plan shell

      - name: Publish validation plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.plan-name }}
          path: .ci-validation/shell/plan.json
          retention-days: 90
          include-hidden-files: true
          overwrite: true

      - name: Reuse equivalent validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci-validation-reuse.js resolve shell

      - name: Validation execution marker
        if: steps.reuse.outputs.skip != 'true'
        run: echo "Running fresh shell validation"

      - name: Configure git identity
        if: steps.reuse.outputs.skip != 'true'
        run: |
          git config --global user.email "ci@superpowers-plus.test"
          git config --global user.name "CI Runner"
      - name: Install BATS
        if: steps.reuse.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch v1.11.0 \
            https://github.com/bats-core/bats-core.git /tmp/bats
          # Pin to the v1.11.0 annotated tag object SHA (not the commit SHA) to
          # prevent mutable-tag supply chain risk. If the tag is rewritten to a
          # new tag object, this SHA will no longer be present and CI will fail.
          git -C /tmp/bats checkout 41fb1bc31d1849b406fb18d4a6d8c6644b8300e7
          sudo /tmp/bats/install.sh /usr/local

      - name: Install shellcheck
        if: steps.reuse.outputs.skip != 'true'
        run: |
          python3 tools/validation-toolchain.py --provision-shellcheck "$RUNNER_TEMP/spp-shellcheck"
          echo "$RUNNER_TEMP/spp-shellcheck" >> "$GITHUB_PATH"

      - name: Bats policy lint (no stale opt-outs)
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-bats-policy-lint-no-stale-opt-outs

      - name: All bats suites (auto-discovered)
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-all-bats-suites-auto-discovered

      - name: Doctor checks tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-doctor-checks-tests
        env:
          PERSONAL_SKILLS_DIR: ${{ github.workspace }}/skills

      - name: TODO lock tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-todo-lock-tests

      - name: TODO engine unit tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-todo-engine-unit-tests

      - name: TODO archive tests
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-todo-archive-tests

      - name: SKILLS.md count lint
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-skills-md-count-lint
      - name: Full-corpus fence-scan (all skills/**/*.md)
        if: steps.reuse.outputs.skip != 'true'
        run: bash tools/test-all.sh --check ci:shell-tests-full-corpus-fence-scan-all-skills-md
      - name: Harness -- skill size audit (advisory)
        if: steps.reuse.outputs.skip != 'true'
        continue-on-error: true
        run: bash tools/test-all.sh --check ci:shell-tests-harness-skill-size-audit-advisory

      - name: Record successful validation
        if: success() && steps.reuse.outputs.skip != 'true'
        run: node tools/ci-validation-reuse.js receipt shell

      - name: Publish successful validation
        if: success() && steps.reuse.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.pass-name }}
          path: .ci-validation/shell/receipt.json
          retention-days: 90
          include-hidden-files: true
          overwrite: true

  windows-install:
    name: Windows Install (Git Bash)
    runs-on: windows-latest
    permissions:
      contents: read
    # Runner shells are elevated; the runner is disposable and single-user.
    env:
      SUPERPOWERS_ALLOW_ELEVATED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install.ps1 refuses an elevated shell without the override
        shell: powershell
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'runner shell is not elevated; this check would prove nothing' }
          $env:SUPERPOWERS_ALLOW_ELEVATED = $null
          # Redirected native stderr throws under the runner's default 'stop'.
          $ErrorActionPreference = 'Continue'
          $err = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -NoPrereqInstall 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($rc -eq 0) { throw 'install.ps1 ran elevated without SUPERPOWERS_ALLOW_ELEVATED=1' }
          if ($err -notmatch 'does not run from an elevated') { throw "install.ps1 failed for another reason: $err" }
          if (Test-Path "$HOME\.local\bin\python3") { throw 'install.ps1 wrote the python3 shim before refusing' }
          # The runner appends 'exit $LASTEXITCODE', which is the refusal's 1.
          exit 0

      - name: Configure git identity
        shell: bash
        run: |
          git config --global user.email "ci@superpowers-plus.test"
          git config --global user.name "CI Runner"

      - name: install.ps1 (Git Bash bootstrap + install.sh)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -NoPrereqInstall

      - name: Verify installed state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(ls -A "$HOME/.claude/skills")"
          test -n "$(ls -A "$HOME/.codex/skills")"
          test -n "$(ls -A "$HOME/.agents/skills")"
          test -x "$HOME/.claude/hooks/pre-tool-use-red-autonomy.sh"
          "$HOME/.local/bin/python3" -c 'import sys; assert sys.version_info >= (3, 8)'
          [ "$(powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('PYTHONUTF8','User')" | tr -d '\r')" = "1" ]
          [ -n "$(powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('CLAUDE_CODE_GIT_BASH_PATH','User')" | tr -d '\r')" ]
          # sp-* commands are wrappers on Windows (ln -s copies there): each must
          # carry the marker and exec its script with a single-quoted path.
          shopt -s nullglob
          wrappers=("$HOME"/.local/bin/sp-*)
          [ "${#wrappers[@]}" -gt 0 ]
          for w in "${wrappers[@]}"; do
            grep -qF '# superpowers-plus sp-* wrapper' "$w"
            grep -q "^exec bash '.*/\.codex/superpowers-plus/" "$w"
          done

      - name: python3.cmd shim (PowerShell)
        shell: powershell
        run: |
          & "$HOME\.local\bin\python3.cmd" -c 'import sys; assert sys.version_info >= (3, 8)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: install.ps1 again (idempotent)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -NoPrereqInstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parts = @([Environment]::GetEnvironmentVariable('Path','User') -split ';' | Where-Object { $_ })
          $n = @($parts | Where-Object { [Environment]::ExpandEnvironmentVariables($_).TrimEnd('\') -ieq "$HOME\.local\bin" }).Count
          if ($n -ne 1) { throw "~\.local\bin appears $n times on the user PATH after a second run" }
          if ([Environment]::ExpandEnvironmentVariables($parts[0]).TrimEnd('\') -ine "$HOME\.local\bin") { throw "~\.local\bin is not first on the user PATH ($($parts[0]) is)" }
          if (@(Get-ChildItem "$HOME\.local\bin\sp-*").Count -eq 0) { throw 'sp-* wrappers missing after a second run' }

      - name: -Force bypasses the ecosystem lock only
        shell: bash
        run: |
          set -euo pipefail
          lock="$HOME/.codex/.superpowers-ecosystem"
          echo other-ecosystem > "$lock"
          sentinel="$HOME/.codex/superpowers-plus/ci-untracked-sentinel"
          # Make the managed dir a real checkout so a stray git clean -fd
          # would actually delete the untracked sentinel.
          managed="$(dirname "$sentinel")"
          mkdir -p "$managed"
          # It needs a reachable origin/main with the local HEAD ahead of it,
          # otherwise the sync stops at "could not fetch" before any reset.
          git init -q --bare "$HOME/ci-origin.git"
          git -C "$managed" init -q -b main
          git -C "$managed" commit -q --allow-empty -m base
          git -C "$managed" remote add origin "$HOME/ci-origin.git"
          git -C "$managed" push -q origin main
          git -C "$managed" commit -q --allow-empty -m local-ahead
          touch "$sentinel"
          if powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -NoPrereqInstall; then
            echo "install.ps1 should refuse a foreign ecosystem without -Force"; exit 1
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -NoPrereqInstall -Force
          [ "$(head -n1 "$lock" | tr -d '\r')" = "superpowers-plus" ]
          # -Force must not run git clean -fd in the managed checkout.
          test -e "$sentinel"

      # Advisory until the suite is ported to Git Bash; failures are reported, not blocking.
      - name: Bats under Git Bash (advisory)
        continue-on-error: true
        shell: bash
        run: |
          npm install -g bats
          export PATH="$HOME/.local/bin:$PATH" PYTHONUTF8=1
          bats test/

      - name: install.ps1 -Uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "$HOME\.local\bin\python3") { throw 'python3 shim not removed' }
          if (Test-Path "$HOME\.local\bin\python3.cmd") { throw 'python3.cmd shim not removed' }
          if (@(Get-ChildItem "$HOME\.local\bin\sp-*" -ErrorAction SilentlyContinue).Count -ne 0) { throw 'sp-* wrappers not removed' }

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dangerous pattern scan
        run: bash tools/test-all.sh --check ci:security-scan-dangerous-pattern-scan

      - name: IP disclosure audit
        run: bash tools/test-all.sh --check ci:security-scan-ip-disclosure-audit
